
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueprint AI - Gerador de Documentação Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css"
    />

    <style>
      :root {
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --secondary: #10b981;
        --accent: #8b5cf6;
        --surface: #1e293b;
        --surface-dark: #0f172a;
        --surface-light: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border: #475569;
        --success: #10b981;
        --warning: #f59e0b;
        --error: #ef4444;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, var(--surface-dark) 0%, #1e1b4b 100%);
        color: var(--text-primary);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-dark);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-light);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
      }
      
      /* Frappe Gantt Customization */
      .gantt .bar-progress {
        fill: var(--primary);
      }
      .gantt .bar {
        fill: var(--surface-light);
      }
      .gantt .handle {
        fill: var(--primary-dark);
      }
      .gantt .grid-header, .gantt .grid-body {
        fill: var(--surface-dark);
      }
      .gantt .grid-row {
         fill: var(--surface);
      }
       .gantt .grid-row:nth-child(odd) {
         fill: var(--surface-dark);
      }
      .gantt .tick {
        stroke: var(--border);
      }
      .gantt .today-highlight {
        fill: rgba(99, 102, 241, 0.2);
      }
      .gantt .upper-text, .gantt .lower-text, .gantt .bar-label, .gantt .bar-group .bar-label {
        fill: var(--text-secondary);
      }

      /* Dragula Kanban Customization */
      .gu-mirror {
        background-color: rgba(99, 102, 241, 0.9) !important;
        opacity: 0.9 !important;
      }
      .gu-transit {
        opacity: 0.2 !important;
        background-color: var(--surface-light) !important;
      }

      /* Enhanced Markdown Rendering Styles */
      .markdown-body {
        line-height: 1.7;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
        scroll-margin-top: 90px;
      }
      .markdown-body h2 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
        margin-top: 2.5rem;
        margin-bottom: 1.5rem;
      }
      .markdown-body h3 {
         margin-top: 2rem;
         margin-bottom: 1rem;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .markdown-body th {
        background-color: var(--surface-light);
        color: var(--text-primary);
        font-weight: 600;
        padding: 0.75rem 1rem;
        text-align: left;
      }
      .markdown-body td {
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border);
      }
      .markdown-body tr:nth-child(even) {
        background-color: rgba(30, 41, 59, 0.5); /* slightly different from surface */
      }
      .markdown-body blockquote {
        border-left: 4px solid var(--accent);
        padding: 0.5rem 1rem;
        margin: 1.5rem 0;
        background-color: rgba(139, 92, 246, 0.05);
        color: var(--text-secondary);
      }
      .markdown-body blockquote p {
        margin: 0;
      }
      .markdown-body .code-block-wrapper {
        position: relative;
        margin: 1.5rem 0;
        background-color: var(--surface-dark);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      .markdown-body .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: var(--surface-light);
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--border);
        border-top-left-radius: 7px;
        border-top-right-radius: 7px;
      }
      .markdown-body .code-lang {
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .markdown-body .copy-code-btn {
        display: flex;
        align-items: center;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        transition: background-color 0.2s, color 0.2s;
      }
      .markdown-body .copy-code-btn:hover {
        background-color: var(--primary);
        color: var(--text-primary);
      }
       .markdown-body pre {
        margin: 0 !important;
        border: none !important;
        background-color: transparent !important;
        padding: 1rem !important;
        overflow-x: auto;
      }

      /* Active TOC Link */
      .toc-link.active {
        background-color: rgba(99, 102, 241, 0.15);
        color: var(--primary);
        font-weight: 600;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

  }
}
</script>

</head>

  </body>
</html>
