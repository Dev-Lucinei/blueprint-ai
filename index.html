
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blueprint AI - Gerador de Documentação Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.3/dist/tesseract.min.js" integrity="sha384-PLsnF3AeZtWBxD7GdeSo28q0iYlgh0mqvDxTVwdOb5ouGKhOHJAAIRGaTHORQEAr" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/dragula/3.7.3/dragula.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.css"
    />

    <style>
      :root {
        /* Legacy (mantidas para compatibilidade) */
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --secondary: #10b981;
        --surface: #1e293b;
        --surface-dark: #0f172a;
        --surface-light: #334155;
        --border: #475569;
        --error: #ef4444;

        /* Design System — Backgrounds */
        --bg-primary: #0f1117;
        --bg-sidebar: #161822;
        --bg-card: #1a1d2e;
        --bg-card-hover: #1f2236;
        --bg-input: #12141f;
        --bg-code: #12141f;

        /* Accent */
        --accent: #8b5cf6;
        --accent-light: #a78bfa;
        --accent-glow: rgba(139, 92, 246, 0.15);

        /* Text */
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;

        /* Borders */
        --border-subtle: #1e2133;
        --border-focus: #8b5cf6;

        /* Status */
        --success: #10b981;
        --success-bg: rgba(16, 185, 129, 0.2);
        --danger: #ef4444;
        --danger-bg: rgba(239, 68, 68, 0.2);
        --warning: #f59e0b;
      }

      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, var(--surface-dark) 0%, #1e1b4b 100%);
        color: var(--text-primary);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface-dark);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--surface-light);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--primary);
      }
      
      /* Frappe Gantt Customization */
      .gantt .bar-progress {
        fill: var(--primary);
      }
      .gantt .bar {
        fill: var(--surface-light);
      }
      .gantt .handle {
        fill: var(--primary-dark);
      }
      .gantt .grid-header, .gantt .grid-body {
        fill: var(--surface-dark);
      }
      .gantt .grid-row {
         fill: var(--surface);
      }
       .gantt .grid-row:nth-child(odd) {
         fill: var(--surface-dark);
      }
      .gantt .tick {
        stroke: var(--border);
      }
      .gantt .today-highlight {
        fill: rgba(99, 102, 241, 0.2);
      }
      .gantt .upper-text, .gantt .lower-text, .gantt .bar-label, .gantt .bar-group .bar-label {
        fill: var(--text-secondary);
      }

      /* Dragula Kanban Customization */
      .gu-mirror {
        background-color: rgba(99, 102, 241, 0.9) !important;
        opacity: 0.9 !important;
      }
      .gu-transit {
        opacity: 0.2 !important;
        background-color: var(--surface-light) !important;
      }

      /* Enhanced Markdown Rendering Styles */
      .markdown-body {
        line-height: 1.7;
      }
      .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
        scroll-margin-top: 90px;
      }
      .markdown-body h2 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
        margin-top: 2.5rem;
        margin-bottom: 1.5rem;
      }
      .markdown-body h3 {
         margin-top: 2rem;
         margin-bottom: 1rem;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .markdown-body th {
        background-color: var(--surface-light);
        color: var(--text-primary);
        font-weight: 600;
        padding: 0.75rem 1rem;
        text-align: left;
      }
      .markdown-body td {
        padding: 0.75rem 1rem;
        border-top: 1px solid var(--border);
      }
      .markdown-body tr:nth-child(even) {
        background-color: rgba(30, 41, 59, 0.5); /* slightly different from surface */
      }
      .markdown-body blockquote {
        border-left: 4px solid var(--accent);
        padding: 0.5rem 1rem;
        margin: 1.5rem 0;
        background-color: rgba(139, 92, 246, 0.05);
        color: var(--text-secondary);
      }
      .markdown-body blockquote p {
        margin: 0;
      }
      .markdown-body .code-block-wrapper {
        position: relative;
        margin: 1.5rem 0;
        background-color: var(--surface-dark);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      }
      .markdown-body .code-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: var(--surface-light);
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--border);
        border-top-left-radius: 7px;
        border-top-right-radius: 7px;
      }
      .markdown-body .code-lang {
        font-family: monospace;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .markdown-body .copy-code-btn {
        display: flex;
        align-items: center;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.8rem;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        transition: background-color 0.2s, color 0.2s;
      }
      .markdown-body .copy-code-btn:hover {
        background-color: var(--primary);
        color: var(--text-primary);
      }
       .markdown-body pre {
        margin: 0 !important;
        border: none !important;
        background-color: transparent !important;
        padding: 1rem !important;
        overflow-x: auto;
      }

      /* Active TOC Link */
      .toc-link.active {
        background-color: rgba(99, 102, 241, 0.15);
        color: var(--primary);
        font-weight: 600;
      }

      /* === ANIMAÇÕES === */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes slideInRight {
        from { opacity: 0; transform: translateX(16px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes slideInLeft {
        from { opacity: 0; transform: translateX(-16px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px var(--accent-glow); }
        50% { box-shadow: 0 0 30px var(--accent-glow), 0 0 40px rgba(139, 92, 246, 0.1); }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes connector-fill {
        from { width: 0%; }
        to { width: 100%; }
      }

      @keyframes connector-fill-vertical {
        from { height: 0%; }
        to { height: 100%; }
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      .animate-fade-in {
        animation: fadeIn 300ms ease-out;
      }

      .animate-slide-in {
        animation: slideInRight 300ms ease-out;
      }

      .animate-slide-in-left {
        animation: slideInLeft 300ms ease-out;
      }

      .animate-pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }

      .animate-spin {
        animation: spin 1s linear infinite;
      }

      .animate-scale-in {
        animation: scale-in 200ms ease-out;
      }

      .animate-shimmer {
        background: linear-gradient(90deg, transparent 25%, rgba(139, 92, 246, 0.08) 50%, transparent 75%);
        background-size: 200% 100%;
        animation: shimmer 2s ease-in-out infinite;
      }

      /* === SMOOTH SCROLL === */
      html {
        scroll-behavior: smooth;
      }

      /* === DROPDOWN ANIMATION === */
      .dropdown-enter {
        animation: scale-in 150ms ease-out forwards;
      }
    </style>
  </head>

  <body class="bg-surface-dark text-text-primary font-inter antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
